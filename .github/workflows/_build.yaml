# Build and test sppc on every target, each on its own
# runner. Called by pr.yaml (to check) and post_merge.yaml
# (to check, then ship).
#
# The targets live here, in one place. "target" names the
# folder spp-stl keeps that target's binaries in, spelled as
# spp spells it (<arch>-<os>[-<env>]: "aarch64-macos", not
# "aarch64-macos-clang"), or spp rejects the folder; "files"
# what goes in it; "cross" the triple a target is cross-built
# for on an x86-64 runner ("toolchain" its gcc package, where that
# is not gcc-<cross>, or "arm-gnu" for Arm's own release, where
# Ubuntu has none), "arch" its cpu (for msvc, the vcvarsall
# target: "arm64" on the arm runner, else x64), "qemu" the emulator
# its tests run under, if they cannot run natively, and
# "packages" anything else they need to run. Every target builds
# and runs every test every time, and "required" ones (all of them)
# fail the build when they fail; a "required: false" one runs
# with continue-on-error, for a port still in progress. Only a
# "ready" target uploads, so an unready one is never shipped.

name: build

on:
  workflow_call:
    inputs:
      upload:
        description: "Upload each ready target's binaries, as sppc-<target>, for shipping."
        required: false
        type: boolean
        default: false

permissions: { }

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu,    os: ubuntu-24.04,     compiler: gcc,   required: true,  ready: true,  files: libsppc.so }
          - { target: aarch64-linux-gnu,   os: ubuntu-24.04-arm, compiler: gcc,   required: true,  ready: true,  files: libsppc.so }
          - { target: x86_64-macos,        os: macos-15-intel,   compiler: clang, required: true,  ready: true, files: libsppc.dylib }
          - { target: aarch64-macos,       os: macos-15,         compiler: clang, required: true,  ready: true, files: libsppc.dylib }
          - { target: x86_64-windows-msvc, os: windows-latest,   compiler: msvc,  required: true, ready: true, files: sppc.dll sppc.lib }
          - { target: aarch64-windows-msvc, os: windows-11-arm,  compiler: msvc,  arch: arm64, required: true, ready: true, files: sppc.dll sppc.lib }
          - { target: i386-linux-gnu,      os: ubuntu-24.04,     compiler: i686-linux-gnu-gcc,  cross: i686-linux-gnu,  arch: i686,  packages: libc6-i386, required: true, ready: true, files: libsppc.so }
          - { target: s390x-linux-gnu,     os: ubuntu-24.04,     compiler: s390x-linux-gnu-gcc, cross: s390x-linux-gnu, arch: s390x, qemu: s390x, required: true, ready: true, files: libsppc.so }
          - { target: powerpc64le-linux-gnu, os: ubuntu-24.04,   compiler: powerpc64le-linux-gnu-gcc, cross: powerpc64le-linux-gnu, arch: ppc64le, qemu: ppc64le, required: true, ready: true, files: libsppc.so }
          - { target: powerpc64-linux-gnu, os: ubuntu-24.04,     compiler: powerpc64-linux-gnu-gcc, cross: powerpc64-linux-gnu, arch: ppc64, qemu: ppc64, required: true, ready: true, files: libsppc.so }
          - { target: powerpc-linux-gnu,   os: ubuntu-24.04,     compiler: powerpc-linux-gnu-gcc, cross: powerpc-linux-gnu, arch: ppc, qemu: ppc, required: true, ready: true, files: libsppc.so }
          - { target: riscv64-linux-gnu,   os: ubuntu-24.04,     compiler: riscv64-linux-gnu-gcc, cross: riscv64-linux-gnu, arch: riscv64, qemu: riscv64, required: true, ready: true, files: libsppc.so }
          - { target: arm-linux-gnueabihf, os: ubuntu-24.04,     compiler: arm-linux-gnueabihf-gcc, cross: arm-linux-gnueabihf, arch: armv7, qemu: arm, required: true, ready: true, files: libsppc.so }
          - { target: arm-linux-gnueabi,   os: ubuntu-24.04,     compiler: arm-linux-gnueabi-gcc, cross: arm-linux-gnueabi, arch: armv5te, qemu: arm, required: true, ready: true, files: libsppc.so }
          - { target: mips-linux-gnu,      os: ubuntu-24.04,     compiler: mips-linux-gnu-gcc, cross: mips-linux-gnu, arch: mips, qemu: mips, required: true, ready: true, files: libsppc.so }
          - { target: mipsel-linux-gnu,    os: ubuntu-24.04,     compiler: mipsel-linux-gnu-gcc, cross: mipsel-linux-gnu, arch: mipsel, qemu: mipsel, required: true, ready: true, files: libsppc.so }
          - { target: mips64el-linux-gnuabi64, os: ubuntu-24.04, compiler: mips64el-linux-gnuabi64-gcc, cross: mips64el-linux-gnuabi64, arch: mips64el, qemu: mips64el, required: true, ready: true, files: libsppc.so }
          - { target: loongarch64-linux-gnu, os: ubuntu-24.04,   compiler: loongarch64-linux-gnu-gcc-14, cross: loongarch64-linux-gnu, toolchain: gcc-14-loongarch64-linux-gnu, arch: loongarch64, qemu: loongarch64, required: true, ready: true, files: libsppc.so }
          - { target: aarch64_be-linux-gnu, os: ubuntu-24.04,    compiler: aarch64_be-none-linux-gnu-gcc, cross: aarch64_be-none-linux-gnu, toolchain: arm-gnu, arch: aarch64_be, qemu: aarch64_be, required: true, ready: true, files: libsppc.so }
          - { target: m68k-linux-gnu,      os: ubuntu-24.04,     compiler: m68k-linux-gnu-gcc, cross: m68k-linux-gnu, arch: m68k, qemu: m68k, required: true, ready: true, files: libsppc.so }
          - { target: sparcv9-linux-gnu,   os: ubuntu-24.04,     compiler: sparc64-linux-gnu-gcc, cross: sparc64-linux-gnu, arch: sparc64, qemu: sparc64, required: true, ready: true, files: libsppc.so }

    # Windows otherwise defaults "run" to PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      # macOS goes without it. Todo: Linux egress stays on
      # audit until its endpoints are known.
      # A cross target installs its toolchain, so keeps sudo.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
          disable-sudo: ${{ !matrix.cross }}

      # Windows arm64 has no agent: there the step logs as much and
      # skips, so egress goes unenforced.
      - name: Harden Runner
        if: runner.os == 'Windows'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # msvc builds with Ninja: the Visual Studio generator builds
      # only whole projects in parallel, each test its own, and pays
      # MSBuild's startup for every one. From pip, so both Windows
      # runners get the same one whatever their image carries.
      - name: Install cmake
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          pip install "cmake>=4.1"
          if [ "$COMPILER" = msvc ]; then pip install ninja; fi

      # The target's gcc and, as its recommendation, libc (into
      # /usr/<triple>, where qemu finds the loader), and what its
      # tests run with: from the cache of a run before, which holds
      # every package the install pulled in.
      - name: Install the cross toolchain
        if: matrix.cross && matrix.toolchain != 'arm-gnu'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: ${{ matrix.toolchain || format('gcc-{0}', matrix.cross) }} ${{ matrix.packages }}
          version: 1

      # Arm's release carries its own glibc, which qemu loads from
      # its sysroot rather than /usr/<triple>.
      - name: Install the Arm toolchain
        if: matrix.toolchain == 'arm-gnu'
        env:
          ARM_GNU: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-aarch64_be-none-linux-gnu.tar.xz
          ARM_GNU_SHA256: bdf8e9b4c62791c5c3aeeb8ba3791421d73c7d147dd04f0da502716885bcc1d2
          COMPILER: ${{ matrix.compiler }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/arm-gnu.tar.xz" "$ARM_GNU"
          echo "$ARM_GNU_SHA256  $RUNNER_TEMP/arm-gnu.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/arm-gnu"
          tar -xJf "$RUNNER_TEMP/arm-gnu.tar.xz" -C "$RUNNER_TEMP/arm-gnu" --strip-components=1
          echo "$RUNNER_TEMP/arm-gnu/bin" >> "$GITHUB_PATH"
          echo "SYSROOT=$("$RUNNER_TEMP/arm-gnu/bin/$COMPILER" -print-sysroot)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/arm-gnu/bin/$COMPILER" --version | head -1

      # Static qemu-user from our qemu fork, not the runner's (8.2): its
      # ppc64le unwinds out of a signal handler into a crash, and its mips
      # loses socket timeouts. The fork carries fixes qemu has not shipped
      # (spp's .triages/upstream-watch.md, U17-U19), ppc32's unwinding
      # through a signal frame among them, and a 32-bit guest's mprotect
      # and msync of unmapped memory succeeding where Linux gives ENOMEM;
      # spp pins the same release.
      - name: Install qemu
        if: matrix.qemu
        env:
          QEMU_TAG: spp-2026.11.09.3
          QEMU_SHA256: 64e805c66d9f64d9d1bedd6dc44b280ee8dc1e5aa7237f606b467a27481705f7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qemu-user.tar.xz" \
            "https://github.com/SamG101-Developer/qemu/releases/download/${QEMU_TAG}/qemu-user-static-${QEMU_TAG}-x86_64.tar.xz"
          echo "$QEMU_SHA256  $RUNNER_TEMP/qemu-user.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qemu"
          tar -xJf "$RUNNER_TEMP/qemu-user.tar.xz" -C "$RUNNER_TEMP/qemu"
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qemu/bin/qemu-x86_64" --version | head -1

      - name: Set up msvc
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: ${{ matrix.arch || 'x64' }}

      # A cross build names the target system, and ctest runs each
      # test through qemu where the runner cannot run it.
      - name: Build (Release)
        env:
          COMPILER: ${{ matrix.compiler }}
          CROSS: ${{ matrix.cross }}
          ARCH: ${{ matrix.arch }}
          QEMU: ${{ matrix.qemu }}
        run: |
          flags=()
          if [ "$COMPILER" = msvc ]; then flags+=(-G Ninja); export CC=cl; else export CC="$COMPILER"; fi
          if [ -n "$CROSS" ]; then
            flags+=(-DCMAKE_SYSTEM_NAME=Linux "-DCMAKE_SYSTEM_PROCESSOR=${ARCH}")
          fi
          if [ -n "$QEMU" ]; then
            flags+=("-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-${QEMU};-L;${SYSROOT:-/usr/${CROSS}}")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${flags[@]}"
          cmake --build build --config Release --parallel

      # AArch64 ELF builds with landing pads and signed return addresses
      # (CMakeLists.txt), but the loader guards the library only if the link
      # kept the GNU property, which the linker drops silently when any input
      # lacks it: the toolchain's own start files do on some (Ubuntu 24.04's
      # crti.o and crtn.o; Arm's crtbeginS.o, crtendS.o and libgcc.a). That
      # leaves the library unguarded, as the compiler leaves "bti" out for a
      # program, so it is a warning: the link is redone, output thrown away,
      # with "-z force-bti", whose warnings name each input without it.
      - name: Check the branch protection property
        if: startsWith(matrix.target, 'aarch64') && endsWith(matrix.target, '-linux-gnu')
        run: |
          lib=$(find build -name libsppc.so -type f | head -n 1)
          if readelf -n "$lib" | grep -E 'AArch64 feature: .*BTI.*PAC'; then exit 0; fi
          inputs=$(cd build && sh -c "$(head -n 1 CMakeFiles/sppc.dir/link.txt) -Wl,-z,force-bti -o $RUNNER_TEMP/force-bti.so" 2>&1 \
            | grep -i 'bti' | sed -E 's/^[^ ]*ld: //; s/: warning:.*//' | xargs -r -n 1 basename | paste -sd ' ' -)
          echo "::warning::$lib is not guarded (no BTI and PAC property); link inputs without it: ${inputs:-none named}"

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect the binaries
        run: |
          mkdir -p dist
          for f in ${{ matrix.files }}; do
            found=$(find build -name "$f" -type f | head -n 1)
            if [ -z "$found" ]; then echo "::error::$f was not built"; exit 1; fi
            cp "$found" dist/
          done
          ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # musl, on a musl system: Alpine's gcc and libgcc are built for it, where a
  # glibc host's musl-gcc wrapper links glibc's libgcc. The crash reporter
  # walks the stack with libunwind there, built here and linked in, so the
  # shipped library needs only musl. Docker's default seccomp profile refuses io_uring, so
  # the ring would go untested under it.
  build-musl:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: x86_64-linux-musl, ready: true }
    container:
      image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: sh
    steps:
      - name: Install the toolchain
        run: |
          apk add --no-cache build-base linux-headers py3-pip
          pip install --break-system-packages --root-user-action=ignore "cmake>=4.1"

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Alpine's libunwind.a is not position-independent, so cannot go
      # into a shared library. Only local unwinding is used: the rest is
      # off, compressed debug info (liblzma) included.
      - name: Build libunwind
        env:
          LIBUNWIND: https://github.com/libunwind/libunwind/releases/download/v1.8.3/libunwind-1.8.3.tar.gz
          LIBUNWIND_SHA256: be30d910e67f58d82e753231f1357f326a1a088acf126b21ff77e60aab19b90b
        run: |
          wget -q -O /tmp/libunwind.tar.gz "$LIBUNWIND"
          echo "$LIBUNWIND_SHA256  /tmp/libunwind.tar.gz" | sha256sum -c -
          mkdir /tmp/libunwind
          tar -xzf /tmp/libunwind.tar.gz -C /tmp/libunwind --strip-components=1
          cd /tmp/libunwind
          ./configure --prefix=/opt/libunwind --disable-shared --enable-static --with-pic \
            --disable-minidebuginfo --disable-zlibdebuginfo --disable-coredump --disable-ptrace \
            --disable-setjmp --disable-tests --disable-documentation
          make -j"$(nproc)" install

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/libunwind
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect the binaries
        run: |
          mkdir -p dist
          cp build/libsppc.so dist/
          if readelf -d dist/libsppc.so | grep -q 'NEEDED.*unwind'; then echo "::error::libsppc.so still needs libunwind"; exit 1; fi
          ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # x32, cross-built here and tested in a Debian VM: no x32 binary
  # runs on the runner, as Ubuntu's kernels leave the x32 syscalls out
  # and qemu-user has no x32 target. The tests that need the build
  # host (the compiler) run here, the rest in the VM.
  build-x32:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: x86_64-linux-gnux32, ready: true }
    steps:
      # The toolchain and qemu install with apt, and KVM opens with
      # udev, so sudo stays.
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install cmake
        run: pip install "cmake>=4.1"

      # The action refreshes apt's lists only when it judges them stale,
      # and installed from lists the mirror had moved past (a 404 for one
      # of qemu's dependencies); its install reports that as success.
      - name: Update the package lists
        run: sudo apt-get update -q

      - name: Install the toolchain and qemu
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: gcc-x86-64-linux-gnux32 libc6-dev-x32-cross qemu-system-x86 qemu-utils xorriso
          version: 1

      # So a failed install, or a cache saved from one, fails here rather
      # than as a missing compiler later: bump "version" above to drop
      # such a cache.
      - name: Check the toolchain and qemu
        run: |
          x86_64-linux-gnux32-gcc --version | head -n 1
          test -f /usr/x86_64-linux-gnux32/lib/crt1.o
          qemu-system-x86_64 --version | head -n 1
          qemu-img --version | head -n 1
          xorriso -version 2>&1 | head -n 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build (Release)
        run: |
          export CC=x86_64-linux-gnux32-gcc
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86_64
          cmake --build build --config Release --parallel

      - name: Test on the runner
        run: ctest --test-dir build --output-on-failure -L host

      # The VM's Debian image, cached by its sha512, the script's pin. It
      # is saved even when the tests fail; the script removes a bad one.
      - name: Find the Debian image
        id: image
        run: echo "sha512=$(sed -n 's/^DEBIAN_IMAGE_SHA512=//p' tools/x32_vm_test.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore the Debian image
        id: restore-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sppc-x32/debian.qcow2
          key: x32-debian-${{ steps.image.outputs.sha512 }}

      - name: Test in the VM
        run: tools/x32_vm_test.sh build ~/.cache/sppc-x32/debian.qcow2

      - name: Save the Debian image
        if: always() && steps.restore-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sppc-x32/debian.qcow2
          key: x32-debian-${{ steps.image.outputs.sha512 }}

      - name: Collect the binaries
        run: |
          mkdir -p dist
          cp build/libsppc.so dist/
          ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # FreeBSD, in a FreeBSD VM: nothing on a Linux runner can run it, so it is
  # built natively, with the base system's clang, and tested there. Its pkg
  # has only cmake 3.31, which is why that is sppc's minimum.
  build-freebsd:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: x86_64-freebsd, release: "15.1", required: true, ready: true }
    steps:
      # The VM's qemu installs from apt, so sudo stays.
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc  # v1.5.9
        with:
          release: ${{ matrix.release }}
          prepare: pkg install -y cmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"
            ctest --test-dir build --build-config Release --output-on-failure
            mkdir -p dist
            cp build/libsppc.so dist/

      - name: Collect the binaries
        run: ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
