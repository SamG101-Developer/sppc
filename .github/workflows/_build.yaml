# Build and test sppc on every target, each on its own
# runner. Called by pr.yaml (to check) and post_merge.yaml
# (to check, then ship).
#
# The targets live here, in one place. "target" names the
# folder spp-stl keeps that target's binaries in, spelled as
# spp spells it (<arch>-<os>[-<env>]: "aarch64-macos", not
# "aarch64-macos-clang"), or spp rejects the folder; "files"
# what goes in it; "cross" the triple a target is cross-built
# for on an x86-64 runner ("toolchain" its gcc package, where that
# is not gcc-<cross>, or "arm-gnu" for Arm's own release, where
# Ubuntu has none), "arch" its cpu, "qemu" the emulator
# its tests run under, if they cannot run natively, and
# "packages" anything else they need to run; "test: false" builds
# a target the runner cannot run at all (x32: Ubuntu's kernels
# leave the x32 syscalls out, and qemu-user has none). Every
# target builds every time, so a port's progress shows, but
# only a "ready" one counts: an unready target may fail
# without failing the build, and never uploads, so it is
# never shipped.

name: build

on:
  workflow_call:
    inputs:
      upload:
        description: "Upload each ready target's binaries, as sppc-<target>, for shipping."
        required: false
        type: boolean
        default: false

permissions: { }

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu,    os: ubuntu-24.04,     compiler: gcc,   required: true,  ready: true,  files: libsppc.so }
          - { target: aarch64-linux-gnu,   os: ubuntu-24.04-arm, compiler: gcc,   required: true,  ready: true,  files: libsppc.so }
          - { target: x86_64-macos,        os: macos-15-intel,   compiler: clang, required: true,  ready: true, files: libsppc.dylib }
          - { target: aarch64-macos,       os: macos-15,         compiler: clang, required: true,  ready: true, files: libsppc.dylib }
          - { target: x86_64-windows-msvc, os: windows-latest,   compiler: msvc,  required: false, ready: false, files: sppc.dll sppc.lib }
          - { target: i386-linux-gnu,      os: ubuntu-24.04,     compiler: i686-linux-gnu-gcc,  cross: i686-linux-gnu,  arch: i686,  packages: libc6-i386, required: true, ready: true, files: libsppc.so }
          - { target: s390x-linux-gnu,     os: ubuntu-24.04,     compiler: s390x-linux-gnu-gcc, cross: s390x-linux-gnu, arch: s390x, qemu: s390x, required: true, ready: true, files: libsppc.so }
          - { target: powerpc64le-linux-gnu, os: ubuntu-24.04,   compiler: powerpc64le-linux-gnu-gcc, cross: powerpc64le-linux-gnu, arch: ppc64le, qemu: ppc64le, required: true, ready: true, files: libsppc.so }
          - { target: powerpc64-linux-gnu, os: ubuntu-24.04,     compiler: powerpc64-linux-gnu-gcc, cross: powerpc64-linux-gnu, arch: ppc64, qemu: ppc64, required: true, ready: true, files: libsppc.so }
          - { target: powerpc-linux-gnu,   os: ubuntu-24.04,     compiler: powerpc-linux-gnu-gcc, cross: powerpc-linux-gnu, arch: ppc, qemu: ppc, required: true, ready: true, files: libsppc.so }
          - { target: riscv64-linux-gnu,   os: ubuntu-24.04,     compiler: riscv64-linux-gnu-gcc, cross: riscv64-linux-gnu, arch: riscv64, qemu: riscv64, required: true, ready: true, files: libsppc.so }
          - { target: arm-linux-gnueabihf, os: ubuntu-24.04,     compiler: arm-linux-gnueabihf-gcc, cross: arm-linux-gnueabihf, arch: armv7, qemu: arm, required: true, ready: true, files: libsppc.so }
          - { target: arm-linux-gnueabi,   os: ubuntu-24.04,     compiler: arm-linux-gnueabi-gcc, cross: arm-linux-gnueabi, arch: armv5te, qemu: arm, required: true, ready: true, files: libsppc.so }
          - { target: mips-linux-gnu,      os: ubuntu-24.04,     compiler: mips-linux-gnu-gcc, cross: mips-linux-gnu, arch: mips, qemu: mips, required: true, ready: true, files: libsppc.so }
          - { target: mipsel-linux-gnu,    os: ubuntu-24.04,     compiler: mipsel-linux-gnu-gcc, cross: mipsel-linux-gnu, arch: mipsel, qemu: mipsel, required: true, ready: true, files: libsppc.so }
          - { target: mips64el-linux-gnuabi64, os: ubuntu-24.04, compiler: mips64el-linux-gnuabi64-gcc, cross: mips64el-linux-gnuabi64, arch: mips64el, qemu: mips64el, required: true, ready: true, files: libsppc.so }
          - { target: loongarch64-linux-gnu, os: ubuntu-24.04,   compiler: loongarch64-linux-gnu-gcc-14, cross: loongarch64-linux-gnu, toolchain: gcc-14-loongarch64-linux-gnu, arch: loongarch64, qemu: loongarch64, required: false, ready: true, files: libsppc.so }
          - { target: aarch64_be-linux-gnu, os: ubuntu-24.04,    compiler: aarch64_be-none-linux-gnu-gcc, cross: aarch64_be-none-linux-gnu, toolchain: arm-gnu, arch: aarch64_be, qemu: aarch64_be, required: true, ready: true, files: libsppc.so }
          - { target: x86_64-linux-gnux32, os: ubuntu-24.04,     compiler: x86_64-linux-gnux32-gcc, cross: x86-64-linux-gnux32, arch: x86_64, packages: libc6-x32, test: false, required: true,  ready: true, files: libsppc.so }
          - { target: m68k-linux-gnu,      os: ubuntu-24.04,     compiler: m68k-linux-gnu-gcc, cross: m68k-linux-gnu, arch: m68k, qemu: m68k, required: true, ready: true, files: libsppc.so }
          - { target: sparcv9-linux-gnu,   os: ubuntu-24.04,     compiler: sparc64-linux-gnu-gcc, cross: sparc64-linux-gnu, arch: sparc64, qemu: sparc64, required: true, ready: true, files: libsppc.so }

    # Windows otherwise defaults "run" to PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      # macOS goes without it. Todo: Linux egress stays on
      # audit until its endpoints are known.
      # A cross target installs its toolchain, so keeps sudo.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: ${{ !matrix.cross }}

      - name: Harden Runner
        if: runner.os == 'Windows'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install cmake
        run: pip install "cmake>=4.1"

      # The target's gcc and, as its recommendation, libc (into
      # /usr/<triple>, where qemu finds the loader), and what its
      # tests run with: from the cache of a run before, which holds
      # every package the install pulled in.
      - name: Install the cross toolchain
        if: matrix.cross && matrix.toolchain != 'arm-gnu'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: ${{ matrix.toolchain || format('gcc-{0}', matrix.cross) }} ${{ matrix.packages }}
          version: 1

      # Arm's release carries its own glibc, which qemu loads from
      # its sysroot rather than /usr/<triple>.
      - name: Install the Arm toolchain
        if: matrix.toolchain == 'arm-gnu'
        env:
          ARM_GNU: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-aarch64_be-none-linux-gnu.tar.xz
          ARM_GNU_SHA256: bdf8e9b4c62791c5c3aeeb8ba3791421d73c7d147dd04f0da502716885bcc1d2
          COMPILER: ${{ matrix.compiler }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/arm-gnu.tar.xz" "$ARM_GNU"
          echo "$ARM_GNU_SHA256  $RUNNER_TEMP/arm-gnu.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/arm-gnu"
          tar -xJf "$RUNNER_TEMP/arm-gnu.tar.xz" -C "$RUNNER_TEMP/arm-gnu" --strip-components=1
          echo "$RUNNER_TEMP/arm-gnu/bin" >> "$GITHUB_PATH"
          echo "SYSROOT=$("$RUNNER_TEMP/arm-gnu/bin/$COMPILER" -print-sysroot)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/arm-gnu/bin/$COMPILER" --version | head -1

      # The newest qemu, not the runner's (8.2): its ppc64le unwinds out
      # of a signal handler into a crash, and its mips loses socket
      # timeouts. Debian's build is static, so it runs here unpacked.
      - name: Install qemu
        if: matrix.qemu
        env:
          QEMU_DEB: https://deb.debian.org/debian/pool/main/q/qemu/qemu-user_11.1.2+ds-3_amd64.deb
          QEMU_SHA256: 4bacc2bf647f1756c5f08e7f146161d3eeef9d9f53e5d6412d1b3daca0c93655
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qemu-user.deb" "$QEMU_DEB"
          echo "$QEMU_SHA256  $RUNNER_TEMP/qemu-user.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/qemu-user.deb" "$RUNNER_TEMP/qemu"
          echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qemu/usr/bin/qemu-x86_64" --version | head -1

      - name: Set up msvc
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      # A cross build names the target system, and ctest runs each
      # test through qemu where the runner cannot run it.
      - name: Build (Release)
        env:
          COMPILER: ${{ matrix.compiler }}
          CROSS: ${{ matrix.cross }}
          ARCH: ${{ matrix.arch }}
          QEMU: ${{ matrix.qemu }}
        run: |
          if [ "$COMPILER" != msvc ]; then export CC="$COMPILER"; fi
          flags=()
          if [ -n "$CROSS" ]; then
            flags+=(-DCMAKE_SYSTEM_NAME=Linux "-DCMAKE_SYSTEM_PROCESSOR=${ARCH}")
          fi
          if [ -n "$QEMU" ]; then
            flags+=("-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-${QEMU};-L;${SYSROOT:-/usr/${CROSS}}")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${flags[@]}"
          cmake --build build --config Release --parallel

      - name: Test
        if: matrix.test != false
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect the binaries
        run: |
          mkdir -p dist
          for f in ${{ matrix.files }}; do
            found=$(find build -name "$f" -type f | head -n 1)
            if [ -z "$found" ]; then echo "::error::$f was not built"; exit 1; fi
            cp "$found" dist/
          done
          ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # musl, on a musl system: Alpine's gcc and libgcc are built for it, where a
  # glibc host's musl-gcc wrapper links glibc's libgcc. The crash reporter
  # walks the stack with libunwind there, built here and linked in, so the
  # shipped library needs only musl. Docker's default seccomp profile refuses io_uring, so
  # the ring would go untested under it.
  build-musl:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: x86_64-linux-musl, ready: true }
    container:
      image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: sh
    steps:
      - name: Install the toolchain
        run: |
          apk add --no-cache build-base linux-headers py3-pip
          pip install --break-system-packages --root-user-action=ignore "cmake>=4.1"

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Alpine's libunwind.a is not position-independent, so cannot go
      # into a shared library. Only local unwinding is used: the rest is
      # off, compressed debug info (liblzma) included.
      - name: Build libunwind
        env:
          LIBUNWIND: https://github.com/libunwind/libunwind/releases/download/v1.8.3/libunwind-1.8.3.tar.gz
          LIBUNWIND_SHA256: be30d910e67f58d82e753231f1357f326a1a088acf126b21ff77e60aab19b90b
        run: |
          wget -q -O /tmp/libunwind.tar.gz "$LIBUNWIND"
          echo "$LIBUNWIND_SHA256  /tmp/libunwind.tar.gz" | sha256sum -c -
          mkdir /tmp/libunwind
          tar -xzf /tmp/libunwind.tar.gz -C /tmp/libunwind --strip-components=1
          cd /tmp/libunwind
          ./configure --prefix=/opt/libunwind --disable-shared --enable-static --with-pic \
            --disable-minidebuginfo --disable-zlibdebuginfo --disable-coredump --disable-ptrace \
            --disable-setjmp --disable-tests --disable-documentation
          make -j"$(nproc)" install

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/libunwind
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect the binaries
        run: |
          mkdir -p dist
          cp build/libsppc.so dist/
          if readelf -d dist/libsppc.so | grep -q 'NEEDED.*unwind'; then echo "::error::libsppc.so still needs libunwind"; exit 1; fi
          ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # FreeBSD, in a FreeBSD VM: nothing on a Linux runner can run it, so it is
  # built natively, with the base system's clang, and tested there. Its pkg
  # has only cmake 3.31, which is why that is sppc's minimum.
  build-freebsd:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: x86_64-freebsd, release: "15.1", ready: false }
    steps:
      # The VM's qemu installs from apt, so sudo stays.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout sppc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc  # v1.5.9
        with:
          release: ${{ matrix.release }}
          prepare: pkg install -y cmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release --parallel
            ctest --test-dir build --build-config Release --output-on-failure
            mkdir -p dist
            cp build/libsppc.so dist/

      - name: Collect the binaries
        run: ls -l dist

      - name: Upload the binaries
        if: inputs.upload && matrix.ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sppc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
